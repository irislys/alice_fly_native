[package]
name = "alice_fly_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[dependencies]
ctrlc = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
